<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hired · Settings</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      width: 340px;
      padding: 16px 18px 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #0f172a;
      background: #ffffff;
    }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .subtitle { color: #64748b; font-size: 12px; margin: 0 0 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .btn {
      padding: 7px 14px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #0f766e; }
    .btn-ghost {
      background: transparent;
      color: #475569;
      border: 1px solid #cbd5e1;
    }
    .btn-ghost:hover { background: #f1f5f9; }
    .status { font-size: 12px; min-height: 16px; }
    .status.ok { color: #16a34a; }
    .status.err { color: #dc2626; }
    .help { color: #64748b; font-size: 11px; margin-top: 10px; line-height: 1.4; }
    .help code { background: #f1f5f9; padding: 1px 4px; border-radius: 3px; font-size: 10px; }
  </style>
</head>
<body>
  <h1>Hired</h1>
  <p class="subtitle">Local personal referral agent.</p>

  <label for="secret">Shared secret</label>
  <input id="secret" type="password" placeholder="paste SHARED_SECRET from .env" autocomplete="off" />

  <div class="row">
    <button id="save" class="btn">Save</button>
    <button id="test" class="btn btn-ghost">Test server</button>
    <span id="status" class="status"></span>
  </div>

  <p class="help">
    Hotkey: <code>Alt+H</code> on any Happy Agent page. Change the shortcut at
    <code>chrome://extensions/shortcuts</code>.
  </p>

  <script type="module" src="src/popup/index.ts"></script>
</body>
</html>
